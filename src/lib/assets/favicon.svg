<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Verity">
  <!-- Verity in miniature: the calculator body, the screen, and the one violet key. -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="#12162f"/>
  <rect x="10" y="13" width="44" height="40" rx="10" fill="#eceaf3"/>
  <!-- Receipt tab above the head. -->
  <rect x="24" y="6" width="16" height="8" rx="2.5" fill="#f7f7fb"/>
  <!-- Screen and face. -->
  <rect x="15" y="18" width="34" height="14" rx="5" fill="#12162f"/>
  <circle cx="24" cy="24" r="2.6" fill="#f7f7fb"/>
  <circle cx="40" cy="24" r="2.6" fill="#f7f7fb"/>
  <path d="M28.5 27.6a5 5 0 0 0 7 0" stroke="#f7f7fb" stroke-width="2" stroke-linecap="round" fill="none"/>
  <!-- Keypad, with the equals key carrying the accent. -->
  <rect x="16" y="36" width="13" height="6" rx="2.4" fill="#9aa0b5"/>
  <rect x="35" y="36" width="13" height="6" rx="2.4" fill="#9aa0b5"/>
  <rect x="16" y="45" width="13" height="6" rx="2.4" fill="#9aa0b5"/>
  <rect x="35" y="45" width="13" height="6" rx="2.4" fill="#5b4cb0"/>
</svg>
